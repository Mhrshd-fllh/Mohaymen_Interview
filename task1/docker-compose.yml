services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine 
    container_name: task1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-city_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_secure_123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # https://last9.io/blog/docker-compose-health-checks/
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_user} -d ${POSTGRES_DB:-city_db}"]
        interval: 10s
        timeout: 5s
        retries: 5
    networks:
      - task1_net

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: task1_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_secure_123} --appendonly yes
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password_secure_123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - task1_net
    
  kafka:
    image: docker.arvancloud.ir/apache/kafka:3.7.0
    container_name: task1_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092, EXTERNAL://0.0.0.0:9092, CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092, EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_CLUSTER_ID: $(KAFKA_CLUSTER_ID)

    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - task1_net

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: task1_api
    restart: unless_stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - task1_network0

volumes:
  postgres_data:
    driver: local
    name: task1_postgres_data
  redis_data:
    driver: local
    name: task1_redis_data
  kafka_data:
    driver: local
    name: task1_kafka_data
    
networks:
  task1_net:
    driver: bridge
    name: task1_network

  